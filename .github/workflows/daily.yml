name: Daily update

# GitHub Actions uses UTC. Taiwan time = UTC+8.
#   09:00 UTC = 17:00 Taiwan,  11:00 UTC = 19:00 Taiwan  (Mon-Fri)
on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest TAIFEX data and save to Supabase
        run: node scripts/daily.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
