name: Daily update

# GitHub Actions uses UTC. Taiwan time = UTC+8.
#   Every 6 hours, every day, at minute 17 (avoids the busy top of the hour):
#   04:17 / 10:17 / 16:17 / 22:17 UTC = 12:17 / 18:17 / 00:17 / 06:17 Taiwan
on:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest TAIFEX data and save to Supabase
        run: node scripts/daily.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
